name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      pack_node_modules: true
    secrets: inherit

  deploy-lambdas:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: .

      - name: Extract production node_modules
        working-directory: backend
        run: |
          if [ ! -f node_modules.tar.gz ]; then
            echo "ERROR: node_modules.tar.gz missing from backend-dist (CI must pack it on workflow_call)" >&2
            exit 1
          fi
          tar -xzf node_modules.tar.gz
          rm -f node_modules.tar.gz
          if [ ! -d node_modules/.prisma ]; then
            echo "ERROR: Prisma client missing from packed node_modules" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # One slim zip for all functions. Zipping raw node_modules exceeds AWS's
      # 250 MB unzipped limit (InvalidParameterValueException on UpdateFunctionCode).
      - name: Package Lambda zip
        working-directory: backend
        run: bash scripts/package-lambda.sh /tmp/lambda.zip

      - name: Deploy each Lambda
        working-directory: backend
        env:
          LAMBDA_S3_BUCKET: ${{ vars.LAMBDA_S3_BUCKET }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          for fn in chatlogix-whatsapp-response-dispatcher \
                    chatlogix-media-fetcher \
                    chatlogix-incoming-response-generator \
                    chatlogix-webhook-handler \
                    chatlogix-order-recovery; do
            echo "=== Uploading $fn to S3 ==="
            aws s3 cp /tmp/lambda.zip \
              "s3://${LAMBDA_S3_BUCKET}/functions/$fn/${GITHUB_SHA}.zip" \
              --region "${AWS_DEFAULT_REGION}"

            echo "=== Updating Lambda $fn ==="
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket "${LAMBDA_S3_BUCKET}" \
              --s3-key "functions/$fn/${GITHUB_SHA}.zip" \
              --region "${AWS_DEFAULT_REGION}" \
              --publish

            aws lambda wait function-updated \
              --function-name "$fn" \
              --region "${AWS_DEFAULT_REGION}"

            echo "=== $fn deployed ==="
          done

  deploy-ec2:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: artifacts/backend-dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend-dist

      - name: Pack pre-built dist + node_modules into a tarball
        run: |
          mkdir -p stage/backend
          mkdir -p stage/www/marketing stage/www/vendor stage/www/admin
          mkdir -p stage/frontend

          cp -a artifacts/backend-dist/backend/dist stage/backend/dist

          if [ ! -f artifacts/backend-dist/backend/node_modules.tar.gz ]; then
            echo "ERROR: node_modules.tar.gz missing from backend-dist artifact" >&2
            exit 1
          fi
          cp artifacts/backend-dist/backend/node_modules.tar.gz stage/backend/node_modules.tar.gz

          vendor_dist=artifacts/frontend-dist/frontend_v2/apps/web-vendor/dist
          admin_dist=artifacts/frontend-dist/frontend_v2/apps/web-admin/dist
          marketing_dist=artifacts/frontend-dist/frontend_v2/apps/web-marketing/dist

          if [ ! -d "$vendor_dist" ]; then
            echo "ERROR: web-vendor dist not found in artifact" >&2
            exit 1
          fi
          if [ ! -d "$admin_dist" ]; then
            echo "ERROR: web-admin dist not found in artifact" >&2
            exit 1
          fi
          if [ ! -d "$marketing_dist" ]; then
            echo "ERROR: web-marketing dist not found in artifact" >&2
            exit 1
          fi

          cp -a "$vendor_dist/." stage/www/vendor/
          cp -a "$admin_dist/." stage/www/admin/
          cp -a "$marketing_dist/." stage/www/marketing/
          # Keep writing the legacy path until nginx is switched off frontend/dist.
          cp -a "$vendor_dist/." stage/frontend/dist/

          tar -czf chatlogix-dist.tar.gz -C stage .
          ls -lh chatlogix-dist.tar.gz

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist tarball to EC2
        run: |
          scp -i ~/.ssh/id_ed25519 chatlogix-dist.tar.gz \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chatlogix-dist.tar.gz"

      - name: Run deploy script on EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "export DEPLOY_SHA='${{ github.sha }}'; bash -s" < scripts/deployment/deploy-ec2.sh

  # node_modules.tar.gz is 100MB+ and was filling the GitHub Actions storage
  # quota (free accounts get 500MB shared). Drop this run's artifacts as soon
  # as Lambda + EC2 have consumed them.
  cleanup-artifacts:
    needs: [build, deploy-lambdas, deploy-ec2]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete backend-dist and frontend-dist artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );
            const names = new Set(['backend-dist', 'frontend-dist']);
            for (const artifact of artifacts) {
              if (!names.has(artifact.name)) continue;
              core.info(`Deleting ${artifact.name} id=${artifact.id} bytes=${artifact.size_in_bytes}`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }
