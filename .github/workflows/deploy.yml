name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-lambdas:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: .

      - name: Install production deps
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm prune --production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Package and deploy each Lambda
        working-directory: backend
        env:
          LAMBDA_S3_BUCKET: ${{ vars.LAMBDA_S3_BUCKET }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          for fn in chatlogix-whatsapp-response-dispatcher \
                    chatlogix-media-fetcher \
                    chatlogix-incoming-response-generator \
                    chatlogix-webhook-handler \
                    chatlogix-order-recovery; do
            echo "=== Packaging $fn ==="
            zip_path=/tmp/$fn.zip
            rm -f "$zip_path"
            zip -rq "$zip_path" dist node_modules prisma package.json

            echo "=== Uploading $fn to S3 ==="
            aws s3 cp "$zip_path" \
              "s3://${LAMBDA_S3_BUCKET}/functions/$fn/${GITHUB_SHA}.zip" \
              --region "${AWS_DEFAULT_REGION}"

            echo "=== Updating Lambda $fn ==="
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket "${LAMBDA_S3_BUCKET}" \
              --s3-key "functions/$fn/${GITHUB_SHA}.zip" \
              --region "${AWS_DEFAULT_REGION}" \
              --publish

            aws lambda wait function-updated \
              --function-name "$fn" \
              --region "${AWS_DEFAULT_REGION}"

            echo "=== $fn deployed ==="
          done

  deploy-ec2:
    needs: deploy-lambdas
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: artifacts/backend-dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend-dist

      - name: Pack pre-built dist directories into a tarball
        run: |
          mkdir -p stage/backend
          mkdir -p stage/frontend

          cp -r artifacts/backend-dist/backend/dist stage/backend/dist

          if [ -d artifacts/frontend-dist/frontend_v2/apps/web-vendor/dist ]; then
            cp -r artifacts/frontend-dist/frontend_v2/apps/web-vendor/dist stage/frontend/dist
          else
            echo "ERROR: web-vendor dist not found in artifact" >&2
            exit 1
          fi

          tar -czf chatlogix-dist.tar.gz -C stage .
          ls -lh chatlogix-dist.tar.gz

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist tarball to EC2
        run: |
          scp -i ~/.ssh/id_ed25519 chatlogix-dist.tar.gz \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chatlogix-dist.tar.gz"

      - name: Run deploy script on EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              'bash -s' < scripts/deployment/deploy-ec2.sh
