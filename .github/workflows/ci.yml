name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Stage backend artifact
        run: |
          mkdir -p _artifact/backend
          cp -r backend/dist _artifact/backend/dist
          cp -r backend/prisma _artifact/backend/prisma
          cp backend/package.json _artifact/backend/package.json
          cp backend/package-lock.json _artifact/backend/package-lock.json

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: _artifact/
          retention-days: 7
          include-hidden-files: false

  build-frontend:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend_v2/package-lock.json

      - name: Write .env.production
        working-directory: frontend_v2/apps/web-vendor
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=${{ vars.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_ENVIRONMENT=${{ vars.VITE_ENVIRONMENT }}
          EOF

      - name: Install dependencies
        working-directory: frontend_v2
        run: npm ci

      - name: Build
        working-directory: frontend_v2
        run: npm run build

      - name: Stage frontend artifact
        run: |
          mkdir -p _artifact/frontend_v2/apps/web-vendor
          mkdir -p _artifact/frontend_v2/apps/web-admin
          if [ -d frontend_v2/apps/web-vendor/dist ]; then
            cp -r frontend_v2/apps/web-vendor/dist _artifact/frontend_v2/apps/web-vendor/dist
          fi
          if [ -d frontend_v2/apps/web-admin/dist ]; then
            cp -r frontend_v2/apps/web-admin/dist _artifact/frontend_v2/apps/web-admin/dist
          fi

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: _artifact/
          retention-days: 7
          include-hidden-files: false
