name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      pack_node_modules:
        description: Pack production node_modules.tar.gz for Lambda/EC2 deploy jobs
        type: boolean
        default: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: backend
        run: npm run build

      # PRs only need a compile check. Artifact upload is Deploy-only so we
      # don't spend the GitHub Actions storage quota on unused PR tarballs.
      - name: Stage backend artifact
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p _artifact/backend
          cp -a backend/dist _artifact/backend/dist
          cp -a backend/prisma _artifact/backend/prisma
          cp backend/package.json _artifact/backend/package.json
          cp backend/package-lock.json _artifact/backend/package-lock.json

      # Only when Deploy passes pack_node_modules. PR / standalone CI must not
      # upload a 100MB+ tarball. Hidden .prisma / .bin are inside the tar.
      - name: Pack production node_modules
        if: ${{ inputs.pack_node_modules }}
        working-directory: backend
        run: |
          npm prune --omit=dev
          tar -czf "$GITHUB_WORKSPACE/_artifact/backend/node_modules.tar.gz" node_modules
          ls -lh "$GITHUB_WORKSPACE/_artifact/backend/node_modules.tar.gz"

      - name: Upload backend artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: _artifact/
          retention-days: 1
          include-hidden-files: false

  build-frontend:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend_v2/package-lock.json

      - name: Write .env.production
        working-directory: frontend_v2
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENVIRONMENT: ${{ vars.VITE_ENVIRONMENT }}
          VITE_VENDOR_APP_ORIGIN: ${{ vars.VITE_VENDOR_APP_ORIGIN }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
        run: |
          : "${VITE_API_URL:?VITE_API_URL GitHub variable is required}"
          : "${VITE_ENVIRONMENT:=production}"
          : "${VITE_VENDOR_APP_ORIGIN:=https://app.chatlogix.in}"
          : "${VITE_SITE_ORIGIN:=https://www.chatlogix.in}"

          printf '%s\n' \
            "VITE_API_URL=${VITE_API_URL}" \
            "VITE_ENVIRONMENT=${VITE_ENVIRONMENT}" \
            > apps/web-vendor/.env.production

          printf '%s\n' \
            "VITE_API_URL=${VITE_API_URL}" \
            "VITE_ENVIRONMENT=${VITE_ENVIRONMENT}" \
            > apps/web-admin/.env.production

          printf '%s\n' \
            "VITE_VENDOR_APP_ORIGIN=${VITE_VENDOR_APP_ORIGIN}" \
            "VITE_SITE_ORIGIN=${VITE_SITE_ORIGIN}" \
            > apps/web-marketing/.env.production

      - name: Install dependencies
        working-directory: frontend_v2
        run: npm ci

      - name: Build
        working-directory: frontend_v2
        run: npm run build

      - name: Stage frontend artifact
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p _artifact/frontend_v2/apps/web-vendor
          mkdir -p _artifact/frontend_v2/apps/web-admin
          mkdir -p _artifact/frontend_v2/apps/web-marketing

          for app in web-vendor web-admin web-marketing; do
            if [ ! -d "frontend_v2/apps/${app}/dist" ]; then
              echo "ERROR: ${app} dist not found after build" >&2
              exit 1
            fi
            cp -a "frontend_v2/apps/${app}/dist" "_artifact/frontend_v2/apps/${app}/dist"
          done

      - name: Upload frontend artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: _artifact/
          retention-days: 1
          include-hidden-files: false
