# ChatLogix nginx vhosts for chatlogix.in
#
# Copy onto the Lightsail/Bitnami host. Typical paths:
#   /opt/bitnami/nginx/conf/server_blocks/chatlogix.conf
#   or /etc/nginx/sites-available/chatlogix  (then ln -s into sites-enabled)
#
# limit_req_zone must live in the http {} context. If this file is included
# from http {}, keep the zone directive. If it is included inside a server {},
# move the zone line into nginx.conf / bitnami.conf instead.
#
# After DNS resolves, issue certs (Debian):
#   sudo certbot --nginx -d chatlogix.in -d www.chatlogix.in \
#     -d app.chatlogix.in -d api.chatlogix.in -d admin.chatlogix.in
# Bitnami:
#   sudo /opt/bitnami/bncert-tool
#
# Static roots are filled by scripts/deployment/deploy-ec2.sh:
#   /home/bitnami/chatlogix/www/{marketing,vendor,admin}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------------------------------------------------------------------------
# Apex: keep /api and /health on this host so the current vendor SPA
# (VITE_API_URL=https://chatlogix.in/api) keeps working until you rebuild
# with https://api.chatlogix.in/api. Everything else goes to www.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name chatlogix.in;

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 301 https://www.chatlogix.in$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Marketing — www.chatlogix.in
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name www.chatlogix.in;

    root /home/bitnami/chatlogix/www/marketing;
    index index.html;

    # Old vendor bookmarks that used to live on www
    location ~ ^/(login|signup|dashboard|conversations|orders|catalog|settings|onboarding) {
        return 301 https://app.chatlogix.in$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------------
# Vendor portal — app.chatlogix.in
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name app.chatlogix.in;

    root /home/bitnami/chatlogix/www/vendor;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------------
# Admin portal — admin.chatlogix.in
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.chatlogix.in;

    root /home/bitnami/chatlogix/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------------
# API — api.chatlogix.in  (keep the /api prefix; VITE_API_URL ends in /api)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.chatlogix.in;

    client_max_body_size 25m;

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    # Swagger UI is mounted on Express at /docs. The catch-all below returns
    # 404, so this has to be explicit or https://api.chatlogix.in/docs/ never
    # reaches the app. Kept outside /api/ so the UI's static assets are not
    # counted against the API rate limit.
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}

